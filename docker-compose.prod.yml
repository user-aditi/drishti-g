# Production images: compiled API, a production Next build, nothing mounted.
#
#   JWT_SECRET=$(openssl rand -hex 32) docker compose -f docker-compose.prod.yml up --build
#
# The API refuses to start in production with the example secret from
# .env.example, so a real one must come from the shell or the .env file.
# Session cookies are marked Secure: browsers accept that on http://localhost,
# and anywhere else this is meant to sit behind HTTPS.
#
# Like the development compose, this migrates and seeds but does not import the
# 355,430-row corpus. Load it with the tools image once the stack is up:
#
#   docker compose -f docker-compose.prod.yml run --rm setup npm run import:nyc
#
# (the importer reads research/data/nyc/brooklyn.csv, mounted below).
name: drishti-prod

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  setup:
    build:
      context: ./backend
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./research/data/nyc:/research/data/nyc:ro
    command: ["npm", "run", "setup"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: prod
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random value of at least 32 characters}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
