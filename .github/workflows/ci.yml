# The safety net: every push is checked the way a release would be.
#
#   backend   — typecheck, the N5 layering rule, and the full suite on real Postgres
#   frontend  — typecheck and a production build
#   e2e       — the core journeys and the accessibility pass, in a real browser,
#               against a freshly migrated and seeded database (no NYC corpus:
#               every test creates the data it acts on)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drishti
          POSTGRES_PASSWORD: drishti_dev_password
          POSTGRES_DB: drishti_nyc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drishti" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Migrate the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://drishti:drishti_dev_password@localhost:5432/drishti_nyc_test
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Layering (N5)
        run: npm run check:layering
      - name: Test suite
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drishti
          POSTGRES_PASSWORD: drishti_dev_password
          POSTGRES_DB: drishti_nyc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drishti" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The scripts read ../.env; the example's values are the local dev ones.
      - run: cp .env.example .env
      - name: Install
        run: |
          (cd backend && npm ci)
          (cd frontend && npm ci)
      - name: Migrate and seed
        working-directory: backend
        run: npm run setup
      - name: Build the web app
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          API_INTERNAL_URL: http://localhost:4000/api/v1
      - name: Start the API and the web app
        run: |
          (cd backend && nohup npx dotenv -e ../.env -- tsx src/index.ts > ../api.log 2>&1 &)
          (cd frontend && nohup npm start > ../web.log 2>&1 &)
          npx --yes wait-on@8 -t 120000 http-get://localhost:4000/api/v1/health http-get://localhost:3000
      - name: Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Journeys and accessibility
        working-directory: frontend
        run: npm run e2e
      - name: Server logs
        if: failure()
        run: tail -n 200 api.log web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
