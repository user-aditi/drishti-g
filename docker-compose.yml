services:
  postgres:
    image: postgres:16
    container_name: drishti_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrate and populate, once, before anything tries to read.
  #
  # Without this `docker compose up` on a clean machine brings three processes
  # up against an empty database: no tables, every query failing, and a web app
  # rendering errors. The acceptance criterion says compose brings *the whole
  # thing* up, and three running containers with nothing in them is not that.
  #
  # The order is not arbitrary and is the same sequence the README documents:
  # `org:roles` refuses to retire field-worker postings until `migrate:crew` has
  # created the crew records they become. Run out of order it fails, which is
  # the correct behaviour and the reason this is one command rather than four
  # services racing.
  setup:
    build:
      context: ./backend
    container_name: drishti_setup
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/scripts:/app/scripts
    command: ["npm", "run", "setup"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    container_name: drishti_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for the database to be populated, not merely reachable.
      setup:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
    container_name: drishti_web
    environment:
      # The browser talks to the API directly; the Next server talks to it over
      # the compose network, which is why these differ.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      API_INTERNAL_URL: http://api:4000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/next.config.mjs:/app/next.config.mjs
    depends_on:
      - api

volumes:
  postgres_data:
