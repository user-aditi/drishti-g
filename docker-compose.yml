services:
  postgres:
    image: postgres:16
    container_name: drishti_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrate and seed, once, before anything tries to read.
  #
  # Without this `docker compose up` on a clean machine brings three processes
  # up against an empty database: no tables, every query failing, and a web app
  # rendering errors. That happened once (F-06) and this service is the fix.
  #
  # It does NOT import the 355,430-row corpus. That is a separate, deliberate
  # step — `npm run import:nyc` after `python -m drishti_research.nyc_pull` —
  # because it reads a 150MB file that is not vendored, and a compose that
  # silently spent minutes downloading public data on every fresh clone would be
  # a surprise nobody asked for.
  setup:
    build:
      context: ./backend
    container_name: drishti_setup
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/scripts:/app/scripts
      # The seed reads the derived SLA table from research/, which is outside
      # this image's build context. Without this mount a fresh clone failed here
      # with ENOENT, and because api and web wait for setup to succeed, nothing
      # came up at all. Read-only: seeding reads the table and never writes it,
      # and one committed copy cannot drift from a second one in backend/.
      - ./research/data/nyc/sla-table.csv:/research/data/nyc/sla-table.csv:ro
      - ./research/data/nyc/sla-table.meta.json:/research/data/nyc/sla-table.meta.json:ro
    command: ["npm", "run", "setup"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    container_name: drishti_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "4000:4000"
    # The source is mounted so the image need not be rebuilt for every edit, but
    # on Windows and macOS hosts file-change events do not reach the container,
    # so `tsx watch` never notices: the API keeps running the code it booted with.
    # After editing, run `docker compose restart api`. This was found the hard way,
    # verifying a fix against a container still serving the bug.
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for the database to be populated, not merely reachable.
      setup:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
    container_name: drishti_web
    environment:
      # The browser talks to the API directly; the Next server talks to it over
      # the compose network, which is why these differ.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      API_INTERNAL_URL: http://api:4000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/next.config.mjs:/app/next.config.mjs
    depends_on:
      - api

volumes:
  postgres_data:
